name: targetp
description: Run targetp
keywords:
  - fasta
tools:
  - signalp:
      description: |
        TargetP the presence of N-terminal presequences
      homepage: https://services.healthtech.dtu.dk/service.php?TargetP-2.0
      licence: ["Academic"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - fasta:
      type: file
      description: FASTA file
      pattern: "*.{fa,fasta}"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - out_targetp:
      type: file
      description: targetp output file
      pattern: "out_targetp_*"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@toniher"
