name: processHmmscan2TSV
description: Merge all KOALA results
keywords:
  - kegg
tools:
  - processHmmscan2TSV:
      description: |
        Tool for processing all KOALA analyses
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - fasta:
      type: file
      description: KOALA files
      pattern: "koala_*"
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - out_koala:
      type: file
      description: All Koala output
      pattern: "allKoala"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@toniher"
