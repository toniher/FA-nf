name: kofamscan_download
description: Merge all KOALA results
keywords:
  - kegg
tools:
  - curl:
      description: |
        Tool for processing all KOALA analyses
  - bulkDownloadKEGG:
      description: |
        Processing of the downloaded KOALA files
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - ko_version:
        type: string
        description: KOALA version
output:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - ko_list:
        type: file
        description: KOALA files
        pattern: "ko_list"
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - profiles:
        type: directory
        description: KOALA files
        pattern: "ko_list"
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - ko_store:
        type: directory
        description: KOALA files
        pattern: "ko_store"
authors:
  - "@toniher"
